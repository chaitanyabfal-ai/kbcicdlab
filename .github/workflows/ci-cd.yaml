name: ci-cd

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "k8s/**"
      - "helm/**"
      - ".github/workflows/ci-cd.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: kbcicdlab

permissions:
  contents: read
  packages: write

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s app -v

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/kbcicdlab
      - name: Render chart
        run: helm template kbcicdlab helm/kbcicdlab --namespace ${{ env.NAMESPACE }}

  deploy-minikube:
    runs-on: ubuntu-latest
    needs:
      - unit-test
      - build-and-push
      - helm-check
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      - name: Install and start Minikube
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube
          minikube start --driver=docker --kubernetes-version=stable --wait=all
      - name: Build image and load into Minikube
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .
          minikube image load ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          minikube image load ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/kbcicdlab app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n ${{ env.NAMESPACE }}
      - name: Wait for rollout
        run: kubectl rollout status deployment/kbcicdlab -n ${{ env.NAMESPACE }} --timeout=5m
      - name: Smoke test
        run: |
          URL=$(minikube service kbcicdlab -n ${{ env.NAMESPACE }} --url)
          echo "App URL: $URL"
          curl -fsS "$URL/healthz"
          echo
          curl -fsS "$URL/readyz"
          echo
          curl -fsS "$URL/"
          echo
