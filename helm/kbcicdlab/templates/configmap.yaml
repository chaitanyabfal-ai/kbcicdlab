apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kbcicdlab.fullname" . }}-config
  labels:
    {{- include "kbcicdlab.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_MESSAGE: {{ .Values.config.appMessage | quote }}
  PORT: {{ .Values.config.port | quote }}
