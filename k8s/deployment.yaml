apiVersion: apps/v1
kind: Deployment
metadata:
  name: kbcicdlab
  namespace: kbcicdlab
  labels:
    app.kubernetes.io/name: kbcicdlab
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kbcicdlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kbcicdlab
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: app
          image: ghcr.io/chaitanyabfal-ai/kbcicdlab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kbcicdlab-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kbcicdlab-secret
                  key: DB_PASSWORD
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
